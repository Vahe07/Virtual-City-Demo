<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#cfe8f0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual City — интерактивный город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: the city fills the screen as a floating diorama; the HUD floats on the top and bottom edges;
     one info sheet slides up on phones and docks to the right on wide screens. Signage language:
     a white city-limit sign for the name, blue house-number plates for addresses. */
  --ink: #13232c;
  --ink-2: #51636c;
  --paper: #f5f7f6;
  --azure: #1769aa;
  --sea: #14a3b8;
  --coral: #ff6b4a;
  --line: rgba(19, 35, 44, 0.12);
  --wash: rgba(19, 35, 44, 0.06);
  --good: #0ca30c;
  --good-ink: #0a7a0a;
  --warn: #fab219;
  --crit: #d03b3b;
  --board: #0d1418;
  --board-ink: #ffc53d;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #cfe8f0; color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
#city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#city:active { cursor: grabbing; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.glass { background: rgba(255, 255, 255, 0.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 22px rgba(19, 35, 44, 0.16); }

/* HUD */
.hud-top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.citysign {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 9px 13px 8px; border: 0; border-radius: 7px; background: #fff; cursor: pointer; text-align: left;
  box-shadow: inset 0 0 0 2.5px #fff, inset 0 0 0 4px var(--ink), 0 8px 22px rgba(19, 35, 44, 0.18);
}
.cs-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.08em; line-height: 1; }
.cs-sub { font-size: 11.5px; color: var(--ink-2); line-height: 1.1; }
.clockbox { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.clock { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; }
.ck-time { font-family: var(--f-display); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1; }
.ck-day, .ck-temp { font-size: 12px; color: var(--ink-2); }
.ck-ico { width: 13px; height: 13px; border-radius: 50%; flex: none; background: #f7b733; box-shadow: 0 0 0 3px rgba(247, 183, 51, 0.25); }
.ck-ico.moon { background: transparent; box-shadow: inset -4px 2px 0 0 #8ea6d6; }
.speed { display: flex; padding: 3px; border-radius: 999px; }
.speed button { border: 0; background: transparent; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 6px 9px; min-width: 36px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
.speed button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.dock { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 2px; padding: 5px; border-radius: 18px; }
.dock button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; padding: 7px 8px; border: 0; border-radius: 13px; background: transparent; font-size: 11.5px; font-weight: 500; cursor: pointer; }
.dock button:hover { background: var(--wash); }
.dock svg { width: 21px; height: 21px; }
#btnLabels[aria-pressed="true"] { color: var(--azure); }
#btnLabels[aria-pressed="false"] { color: var(--ink-2); }
.toast {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 76px);
  padding: 9px 15px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); transition: opacity 0.4s;
}
.toast.hide { opacity: 0; pointer-events: none; }

/* VC-007 marketplace on narrow phone screens */
@media(max-width:600px){
  .dock {width:calc(100% - 16px);max-width:550px;justify-content:space-around;gap:0;padding:4px 3px;}
  .dock button {min-width:0;flex:1;padding:8px 2px;font-size:10px;}
  .dock svg {width:19px;height:19px;}
}
.vc-market-tools {display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;}
.vc-market-tools button {border:1px solid #cad8df;background:white;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer;}
.vc-market-tools button[aria-pressed="true"] {background:#1769aa;color:white;border-color:#1769aa;}
.vc-market-count {color:#51636c;font-size:12px;margin:12px 0 4px;}
.vc-market-search {width:100%;padding:11px;border:1px solid #b9ced6;border-radius:10px;font:inherit;}
.vc-market-item {padding:12px;border:1px solid #d5e1e6;background:white;border-radius:12px;margin:9px 0;}
.vc-market-item h3 {font-size:15px;line-height:1.3;margin:0 0 5px;overflow-wrap:anywhere;}
.vc-market-item .vc-buy {margin-bottom:0;}
/* sheet */
.sheet {
  position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; max-height: min(74%, 680px); display: flex; flex-direction: column;
  background: var(--paper); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(19, 35, 44, 0.25);
  transform: translateY(105%); transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: none; }
.sheet-head { position: relative; flex: none; display: flex; align-items: center; padding: 10px 12px 2px; min-height: 48px; touch-action: none; }
.sh-grip { position: absolute; left: 50%; top: 8px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: rgba(19, 35, 44, 0.18); }
.sh-btn { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--wash); font-size: 18px; line-height: 1; cursor: pointer; }
#shClose { margin-left: auto; font-size: 15px; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 2px 16px 22px; }
@media (min-width: 860px) {
  .sheet { left: auto; right: 16px; top: 16px; bottom: 16px; width: 400px; max-height: none; border-radius: 20px; transform: translateX(calc(100% + 28px)); }
  .sheet.open { transform: none; }
  .sh-grip { display: none; }
  .dock { left: 24px; transform: none; }
  body.sheet-open .hud-top { padding-right: 432px; }
  .toast { left: 24px; transform: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .toast { transition: none; } }

/* card */
.hero { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin: 0 0 14px; }
.hero-t { min-width: 0; }
.hero-t.solo { margin: 0 0 12px; }
.portrait { width: 96px; height: 96px; border-radius: 16px; background: linear-gradient(#e7f4f7, #d4e8ee); }
.avatar, .badge { width: 96px; height: 96px; border-radius: 16px; display: grid; place-items: center; font-size: 46px; background: linear-gradient(#e7f4f7, #d4e8ee); }
.badge { background: color-mix(in srgb, var(--tint, var(--sea)) 18%, #fff); color: var(--tint, var(--sea)); font-size: 44px; }
.kind { margin: 0 0 4px; font-size: 12.5px; color: var(--ink-2); }
.title { margin: 0 0 8px; font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.route { margin: 0; font-weight: 600; }
.plate {
  display: inline-flex; align-items: stretch; max-width: 100%; border-radius: 7px; overflow: hidden; background: var(--azure); color: #fff; font-family: var(--f-display);
  box-shadow: inset 0 0 0 2px var(--azure), inset 0 0 0 3.5px #fff;
}
.plate-st { display: flex; align-items: center; padding: 6px 9px 6px 11px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.15; }
.plate-n { display: flex; align-items: center; padding: 4px 11px 4px 9px; border-left: 1.5px solid rgba(255, 255, 255, 0.9); font-size: 19px; font-weight: 700; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--wash); font-size: 12.5px; font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); display: inline-block; }
.dot.ok { background: var(--good); }
.dot.off { background: var(--crit); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0 0 14px; border-radius: 12px; overflow: hidden; background: var(--line); }
.facts > div { background: #fff; padding: 9px 11px; min-width: 0; }
.facts.one { grid-template-columns: 1fr; }
.facts dt { margin: 0 0 2px; font-size: 11.5px; color: var(--ink-2); }
.facts dd { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.sec { margin: 16px 0 0; }
.sec h3, .dir-h { margin: 0 0 8px; font-family: var(--f-display); font-weight: 500; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.dir-h { margin-top: 18px; }
.desc { margin: 0 0 12px; font-size: 14px; line-height: 1.5; max-width: 65ch; }
.note { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.pet { margin: 10px 0 0; font-size: 13.5px; }
.lnk { border: 0; padding: 0; background: none; color: var(--azure); font-weight: 600; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.menu { list-style: none; margin: 0; padding: 0; }
.menu li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.menu li span:first-child { flex: 1; }
.menu li.past { color: var(--ink-2); }
.menu .tm { font-variant-numeric: tabular-nums; margin-right: 6px; }
.price { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prow, .drow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.prow:hover, .drow:hover { background: var(--wash); }
.prow .av { width: 30px; flex: none; font-size: 22px; text-align: center; }
.prow .pn, .drow .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prow b, .drow b { font-weight: 600; font-size: 14px; }
.prow small, .drow small { font-size: 12px; color: var(--ink-2); }
.chev { color: var(--ink-2); font-size: 20px; }
.drow .ic { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--wash); font-size: 18px; }
.st { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.st.ok { color: var(--good-ink); }
.st.warn { color: #9a6700; font-weight: 600; }
.more { display: block; width: 100%; margin: 10px 0 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 600; color: var(--azure); cursor: pointer; }
.vacs { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }
.co { padding: 10px 0 4px; border-top: 1px solid var(--line); }
.co-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.co-h span { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.co-t { margin: 2px 0 2px; font-size: 12.5px; color: var(--ink-2); }

/* apartments */
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 8px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 12px; height: 12px; border-radius: 3px; display: inline-block; background: #dcebf1; }
.lg.sale { background: #fff; box-shadow: inset 0 0 0 2px var(--warn); }
.lg.rent { background: #fff; box-shadow: inset 0 0 0 2px var(--good); }
.aptgrid { display: grid; grid-template-columns: 24px repeat(var(--cols), minmax(0, 1fr)); gap: 3px; }
.aptgrid .fl { display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.apt { height: 27px; border: 0; border-radius: 6px; background: #dcebf1; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }
.apt.sale { background: #fff; box-shadow: inset 0 0 0 2px var(--warn); }
.apt.rent { background: #fff; box-shadow: inset 0 0 0 2px var(--good); }
.apt.on { background: var(--azure); color: #fff; box-shadow: none; }
.aptd { padding: 12px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); scroll-margin: 16px; }
.aptd-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: baseline; margin: 0 0 4px; }
.aptd-h span { font-size: 12.5px; color: var(--ink-2); }
.vac { margin: 6px 0 0; font-size: 14px; }

/* overview */
.city-hero { display: flex; flex-direction: column; gap: 10px; margin: 0 0 14px; }
.citysign.big { align-self: flex-start; cursor: default; padding: 12px 18px 11px; }
.citysign.big .cs-name { font-size: 26px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { padding: 10px 12px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.tile .lbl { font-size: 12px; color: var(--ink-2); }
.tile .val { margin: 2px 0; font-size: 22px; font-weight: 650; line-height: 1.15; }
.tile .sub { font-size: 11.5px; color: var(--ink-2); }
.meter { height: 8px; margin: 8px 0 0; border-radius: 4px; overflow: hidden; background: #d3edf2; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--sea); }
.meter.warn { background: #fdecc4; }
.meter.warn i { background: var(--warn); }
.enr { padding: 12px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
.enr-row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.enr-row b { font-variant-numeric: tabular-nums; }
.enr-note { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); }
.enr-src { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 0; font-size: 12.5px; }
.enr-src span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.sun { background: #f2b705; }
.sw.wind { background: var(--sea); }

/* directory */
.search-l { display: block; margin: 0 0 6px; font-size: 12px; color: var(--ink-2); }
.search { width: 100%; margin: 0 0 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: 15px var(--f-body); color: var(--ink); }
.cats { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 8px; padding: 0 16px 6px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; padding: 7px 12px; border: 0; border-radius: 999px; background: var(--wash); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.cats button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.empty { margin: 16px 0; color: var(--ink-2); }

/* flight board */
.board { padding: 10px; border-radius: 14px; background: var(--board); color: var(--board-ink); font-family: var(--f-mono); }
.board.mini .brow:first-child { border-top: 0; }
.btabs { display: flex; gap: 6px; margin: 0 0 8px; }
.btabs button { flex: 1; padding: 8px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, 0.08); color: #cfd8dc; font: 600 13px var(--f-body); cursor: pointer; }
.btabs button[aria-selected="true"] { background: var(--board-ink); color: var(--board); }
.board-now { margin: 0 2px 6px; font: 12px var(--f-body); color: #8fa0a8; }
.board-now b { color: var(--board-ink); font-family: var(--f-mono); }
.brow { display: grid; grid-template-columns: 44px 58px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 2px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.brow.head { padding-top: 2px; border-top: 0; color: #7f8c92; font: 600 10.5px var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; }
.brow .city { color: #fff; font: 500 13.5px var(--f-body); overflow-wrap: anywhere; }
.bst { padding: 3px 7px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); font-size: 11px; white-space: nowrap; }
.bst.go { background: var(--good); color: #fff; }
.bst.reg { background: var(--warn); color: #0b0b0b; }
.bst.bad { background: var(--crit); color: #fff; }
.bst.closed { color: #ffd98a; }
.bst.done { color: #7f8c92; background: transparent; }
@media (max-width: 380px) { .dock button { min-width: 62px; } .speed button { min-width: 32px; padding: 6px 7px; } .citysign .cs-sub { display: none; } }


/* VC-008 visual property cards */
.vc-photo{margin:10px 0 16px;position:relative;background:linear-gradient(135deg,#c9e4ea,#e8e2d3);border-radius:14px;overflow:hidden;min-height:160px}
.vc-photo img{display:block;width:100%;height:205px;object-fit:cover;object-position:center}
.vc-photo figcaption{padding:8px 12px;font-size:11.5px;color:#51636c;background:#f0f5f6}
.vc-income-panel{padding:7px 12px;margin:10px 0;background:#e8f4f2;border:1px solid #b8dcd3;border-radius:12px}
.vc-income-panel .vc-stat:last-of-type b{color:#087b53}
/* Virtual City interactive ownership layer */
.vc-select {width:100%;padding:11px;border:1px solid #b9ced6;border-radius:9px;background:white;color:#13232c;font:inherit;margin:6px 0 8px}
.vc-label{display:block;margin-top:12px;font-weight:600;font-size:13px}
.vc-ghost{display:block;width:100%;padding:12px 14px;margin:10px 0;border:1px solid #1769aa;background:white;color:#1769aa;font-weight:700;border-radius:10px;cursor:pointer}
.vc-stat span{max-width:64%;overflow-wrap:anywhere}
.vc-stat b{text-align:right;overflow-wrap:anywhere}

.vc-hud { position:fixed; z-index:6; top: max(68px, env(safe-area-inset-top) + 56px); left:12px; padding:8px 11px; border:0; border-radius:12px; background:rgba(255,255,255,.94); box-shadow:0 5px 19px #13232c33; color:#13232c; font-weight:700; font-size:12px; cursor:pointer; text-align:left; }
.vc-hud span {display:block; font-size:10px; font-weight:500; color:#51636c}
.vc-buy {display:block; width:100%; padding:12px 14px; background:#1769aa; color:white; border:0; border-radius:10px; font-weight:700; cursor:pointer; margin:10px 0}
.vc-buy[disabled] {background:#d9e1e4; color:#62717b; cursor:default}
.vc-estate {background:#fff; border:1px solid rgba(19,35,44,.12); padding:12px; border-radius:12px; margin:14px 0}
.vc-estate h3 {font-size:12px; margin:0 0 8px; letter-spacing:.08em; text-transform:uppercase}
.vc-stat {display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #e9eeee}
.vc-stat:last-child {border-bottom:0}
.vc-tag {font-size:11px; color:#51636c}
.vc-notice {font-size:11px; color:#51636c; margin:10px 0 0; line-height:1.5}
.vc-list-btn {width:100%; background:#fff; border:1px solid #e0e7e9; border-radius:9px; padding:10px; text-align:left; margin:4px 0; cursor:pointer}
@media(max-width:480px){.vc-hud{top:max(78px, env(safe-area-inset-top) + 66px); left:10px;}}
</style>
</head>
<body>
<canvas id="city" aria-label="Карта города Virtual City. Нажмите на здание, машину или самолёт, чтобы открыть карточку."></canvas>
<header class="hud-top">
  <button class="citysign" id="citySign" type="button" aria-label="Обзор города Virtual City"><span class="cs-name">VIRTUAL CITY</span><span class="cs-sub" id="citySub"></span></button>
  <div class="clockbox">
    <div class="clock glass"><span class="ck-ico sun" id="ckIco" aria-hidden="true"></span><span class="ck-time" id="ckTime">12:00</span><span class="ck-day" id="ckDay"></span><span class="ck-temp" id="ckTemp"></span></div>
    <div class="speed glass" role="group" aria-label="Скорость времени">

function genGround() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = MAP[y][x];
    let t = CH2T[ch];
    if (t === undefined) t = y >= 22 ? TT.SAND : ('crsT'.indexOf(ch) >= 0 ? TT.PLAZA : TT.GRASS);
    ground[idx(x, y)] = t;
  }
  STREETS.forEach((s, si) => {
    streetOrigin[s.n] = Math.min(streetOrigin[s.n] ?? 99, s.a);
    for (let t = s.a; t <= s.b; t++) {
      const x = s.ax === 'h' ? t : s.c, y = s.ax === 'h' ? s.c : t, i = idx(x, y);
      ground[i] = isWetT(ground[i]) ? TT.BRIDGE : TT.ROAD;
      tileStreets[i].push(si);
    }
  });
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);

function genAddresses() {

        if (isRoadAt(nx, ny)) { hit = { x: nx, y: ny, d }; break outer; }

    }
    if (!hit) hit = bfsRoad(b);
    const si = tileStreets[idx(hit.x, hit.y)];
    const want = (hit.d === 1 || hit.d === 3) ? 'h' : 'v';
    const s = STREETS[si.find(q => STREETS[q].ax === want) ?? si[0]];
    const o = streetOrigin[s.n];

function genJobs() {

    const groups = b.apts ? b.apts.map(a => a.ppl) : (b.ppl ? [b.ppl] : []);

      if (mom && r() < 0.75) mom.st = 'mat';

function genDecor() {

function vcLoad(){
  let x;

  if(!x || !Number.isFinite(x.balance) || x.balance<0 || !x.owned || typeof x.owned!=='object' || Array.isArray(x.owned) || !Array.isArray(x.transactions)) return vcFresh();
  x.listings=x.listings && typeof x.listings==='object' && !Array.isArray(x.listings)?x.listings:{};
  x.simMonths=Number.isInteger(x.simMonths) && x.simMonths>=0?x.simMonths:0;
  x.simIncome=Number.isFinite(x.simIncome) && x.simIncome>=0?x.simIncome:0;
  x.demoBought=x.demoBought && typeof x.demoBought==='object' && !Array.isArray(x.demoBought)?x.demoBought:{};
  for (const [id, o] of Object.entries(x.owned)) {
    if (!o || !Number.isFinite(o.price)) {delete x.owned[id]; delete x.listings[id];continue;}
    // VC-005 ownership was always 100%. Migration retains these purchases.
    o.share=Number.isInteger(o.share) && o.share>0 && o.share<=100?o.share:100;
  }
  for (const id of Object.keys(x.listings)) if(!x.owned[id] || !Number.isFinite(x.listings[id].asking) || x.listings[id].asking<=0) delete x.listings[id];

function vcDemoOffers(){
  // Choose stable, real places from the map, rather than inventing building IDs.
  const groups=[
    {kind:'house',count:2,share:100},
    {kind:'cafe',count:2,share:10},
    {kind:'rest',count:2,share:10},
    {kind:'shop',count:2,share:10},
    {kind:'mall',count:1,share:5},
    {kind:'hotel',count:1,share:5},
    {kind:'office',count:1,share:5}
  ];
  const out=[];
  for(const g of groups){
    const choices=BLD.filter(b=>b && b.kind===g.kind && vcEligible(b,null)).sort((a,b)=>a.id-b.id);
    for(let i=0;i<Math.min(g.count,choices.length);i++){
      const b=choices[i],id=vcId(b,null),share=g.share;
      // One fictional seller owns only this demo offer; no live seller account exists.
      out.push({id,title:vcAssetName(b,null),building:b.id,share,asking:Math.round(vcPrice(b,null)*share/100*(1.08+i*.06)),seller:VC_DEMO_SELLERS[out.length%VC_DEMO_SELLERS.length],kind:b.kind,demo:true});
    }
  }
  return out;
}
function vcMarketCategory(kind){return ['house'].includes(kind)?'housing':['shop','cafe','rest'].includes(kind)?'business':'large';}
function vcMarketOffers(){
  const own=Object.entries(VC.listings).filter(([id,l])=>VC.owned[id]).map(([id,l])=>{
    const o=VC.owned[id],r=vcResolve(id);
    return {id,title:o.title,share:l.share,asking:l.asking,seller:'Вы (этот браузер)',kind:r?r.b.kind:'house',demo:false,building:o.building,apt:o.apt};
  });
  const example=vcDemoOffers().filter(l=>!VC.demoBought[l.id]);
  return [...own,...example];
}
function vcMarketRows(){
  const q=VC_MARKET_QUERY.trim().toLocaleLowerCase('ru');
  const offers=vcMarketOffers().filter(o=>
    (VC_MARKET_CATEGORY==='all'||(VC_MARKET_CATEGORY==='mine'&&!o.demo)||vcMarketCategory(o.kind)===VC_MARKET_CATEGORY) &&
    (!q||[o.title,o.id,o.seller].some(v=>String(v).toLocaleLowerCase('ru').includes(q)))
  );
  const rows=offers.map(o=>{
    const owned=vcOwnedShare(o.id),canBuy=o.demo&&owned+o.share<=100;
    const controls=!o.demo?`<button class="vc-ghost" data-vc-cancel="${esc(o.id)}">Снять объявление</button><button class="vc-buy" data-vc-sim-sell="${esc(o.id)}">Имитировать продажу (тест)</button>`:
      `<button class="vc-buy" data-vc-buy-demo="${esc(o.id)}" ${canBuy?'':'disabled'}>${canBuy?'Купить у демо-продавца':'Покупка недоступна: недостаточно свободной доли'}</button>`;
    return `<article class="vc-market-item"><h3>${esc(o.title)}</h3><div class="vc-tag">${esc(o.id)} · ${o.demo?'Учебное предложение':'Ваше объявление'}</div>
    <div class="vc-stat"><span>Продавец</span><b>${esc(o.seller)}</b></div>
    <div class="vc-stat"><span>Доля на продажу</span><b>${o.share}%</b></div>
    <div class="vc-stat"><span>Цена</span><b>${vcMoney(o.asking)}</b></div>

function vcMarketBuyDemo(id){
  const offer=vcDemoOffers().find(o=>o.id===id);
  if(!offer||VC.demoBought[id])return;
  const current=vcOwnedShare(id);
  if(current+offer.share>100){alert('Для этой покупки недостаточно свободной доли.');return;}
  if(VC.balance<offer.asking){alert('Недостаточно тестовых купонов.');return;}
  if(!confirm('Купить '+offer.share+'% в «'+offer.title+'» за '+vcMoney(offer.asking)+' у вымышленного демо-продавца?'))return;
  const r=vcResolve(id);if(!r)return;
  VC.balance-=offer.asking;
  if(VC.owned[id]){VC.owned[id].share+=offer.share;VC.owned[id].price+=offer.asking;}
  else VC.owned[id]={id,building:r.b.id,apt:r.apt,price:offer.asking,share:offer.share,title:offer.title,date:new Date().toISOString()};
  VC.demoBought[id]=true;
  vcRecord(id,'Покупка на учебном рынке '+offer.share+'%',-offer.asking,offer.seller);
  vcAfterChange();
}

  <button class="more" data-vc-reset="1">Сбросить локальный демо-прогресс</button>`;

/* ui.js — HUD, info sheet, gestures, picking, boot */
const $ = s => document.querySelector(s);
const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
const uniq = a => [...new Set(a)];
const UI = { stack: [], open: false };
const ZMIN = 0.28, ZMAX = 3.2;
let FLY = null, FOLLOW = false, REDUCED = false, HUD_MIN = -1, LAST = 0;
const INERT = { vx: 0, vy: 0 };
const PTR = new Map();
let TAP = null, PINCH = null, LASTMV = 0;

function initUI() {
  REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  UI.sheet = $('#sheet'); UI.body = $('#shBody'); UI.back = $('#shBack'); UI.toast = $('#toast');
  $('#shClose').addEventListener('click', closeSheet);
  UI.back.addEventListener('click', goBack);
  UI.body.addEventListener('click', onSheetClick);
  UI.body.addEventListener('input', onSheetInput);
  document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
  $('#vcWallet').addEventListener('click', () => openView({k:'player'},true));
  vcUpdateWallet();
  $('#citySign').addEventListener('click', () => openView({ k: 'city' }, true));
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.open;
    openView(k === 'dir' ? { k: 'dir', q: '', cat: '' } : { k }, true);
  }));
  $('#btnLabels').addEventListener('click', () => { SHOW_LABELS = !SHOW_LABELS; $('#btnLabels').setAttribute('aria-pressed', String(SHOW_LABELS)); });
  CV.addEventListener('pointerdown', onDown);
  CV.addEventListener('pointermove', onMove);
  CV.addEventListener('pointerup', onUp);
  CV.addEventListener('pointercancel', onUp);
  CV.addEventListener('wheel', onWheel, { passive: false });
  addEventListener('keydown', onKey);
  $('#citySub').textContent = fmt(STATS.pop) + ' ' + plural(STATS.pop, ['житель', 'жителя', 'жителей']) + ' · ' + STATS.bld + ' ' + plural(STATS.bld, ['здание', 'здания', 'зданий']);
  setSpeed(SIM.sp);
  setInterval(liveTick, 1000);
  setTimeout(hideToast, 9000);
  initSheetDrag();
}
function initSheetDrag() {
  const head = $('#sheetHead');
  let y0 = null, dy = 0;
  head.addEventListener('pointerdown', e => {
    if (VW >= 860 || e.target.closest('button')) return;
    y0 = e.clientY; dy = 0; head.setPointerCapture(e.pointerId); UI.sheet.style.transition = 'none';
  });
  head.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); UI.sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; UI.sheet.style.transition = ''; UI.sheet.style.transform = ''; if (dy > 80) closeSheet(); };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
}
function setSpeed(i) {
  SIM.sp = i;
  document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === i)));
}
function hideToast() { if (UI.toast) UI.toast.classList.add('hide'); }
function updateHUD() {
  const m = Math.floor(SIM.min);
  if (m === HUD_MIN) return;
  HUD_MIN = m;
  $('#ckTime').textContent = hm(m);
  $('#ckDay').textContent = DAYS_SHORT[wday()];
  const t = tempNow();
  $('#ckTemp').textContent = (t > 0 ? '+' : '') + t + '°';
  $('#ckIco').className = 'ck-ico ' + (LIGHT.d > 0.4 ? 'sun' : 'moon');
}

/* camera */
function clampCam() { CAM.z = clamp(CAM.z, ZMIN, ZMAX); CAM.x = clamp(CAM.x, -W * HW, W * HW); CAM.y = clamp(CAM.y, -80, (W + H) * HH); }
function zoomAt(sx, sy, nz) {
  nz = clamp(nz, ZMIN, ZMAX);
  const wx = CAM.x + (sx - VW / 2) / CAM.z, wy = CAM.y + (sy - VH / 2) / CAM.z;
  CAM.z = nz; CAM.x = wx - (sx - VW / 2) / nz; CAM.y = wy - (sy - VH / 2) / nz;
  clampCam();
}
function sheetH() { return UI.open ? (UI.sheet.getBoundingClientRect().height || VH * 0.6) : 0; }
function focusPoint() {
  if (!UI.open) return [VW / 2, VH / 2];
  if (VW >= 860) return [(VW - 420) / 2, VH / 2];
  return [VW / 2, Math.max(120, (VH - sheetH()) / 2 + 40)];
}
function flyTo(wx, wy, z) {
  const tz = clamp(z || CAM.z, ZMIN, ZMAX), f = focusPoint();
  const tx = wx - (f[0] - VW / 2) / tz, ty = wy - (f[1] - VH / 2) / tz;
  if (REDUCED) { CAM.x = tx; CAM.y = ty; CAM.z = tz; clampCam(); return; }
  FLY = { x0: CAM.x, y0: CAM.y, z0: CAM.z, x1: tx, y1: ty, z1: tz, t: 0 };
}
function focusB(b, zoom) { flyTo(ix(b.cx, b.cy), iy(b.cx, b.cy, b.topZ * 0.45), zoom || Math.max(CAM.z, 1.25)); }
function ensureVisible(b) {
  const X = (ix(b.cx, b.cy) - CAM.x) * CAM.z + VW / 2, Y = (iy(b.cx, b.cy, b.topZ * 0.5) - CAM.y) * CAM.z + VH / 2;
  const hidden = VW >= 860 ? X > VW - 440 : Y > VH - sheetH() - 20;
  if (hidden || Y < 90) flyTo(ix(b.cx, b.cy), iy(b.cx, b.cy, b.topZ * 0.5), CAM.z);
}
function stepCamera(dt) {
  if (FLY) {
    FLY.t = Math.min(1, FLY.t + dt / 0.75);
    const t = FLY.t, e = t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2;
    CAM.x = lerp(FLY.x0, FLY.x1, e); CAM.y = lerp(FLY.y0, FLY.y1, e); CAM.z = Math.exp(lerp(Math.log(FLY.z0), Math.log(FLY.z1), e));
    if (FLY.t >= 1) FLY = null;
    clampCam();
  } else if (FOLLOW && SEL && !PTR.size) {
    const o = selObj();
    if (o) {
      const f = focusPoint(), tx = ix(o.x, o.y) - (f[0] - VW / 2) / CAM.z, ty = iy(o.x, o.y, (o.z || 0) + 4) - (f[1] - VH / 2) / CAM.z, k = 1 - Math.exp(-dt * 3);
      CAM.x += (tx - CAM.x) * k; CAM.y += (ty - CAM.y) * k; clampCam();
    } else FOLLOW = false;
  } else if (!PTR.size && Math.abs(INERT.vx) + Math.abs(INERT.vy) > 2) {
    CAM.x += INERT.vx * dt; CAM.y += INERT.vy * dt;
    const k = Math.exp(-dt * 4.5); INERT.vx *= k; INERT.vy *= k;
    clampCam();
  }
}

/* gestures */
function pinchOf() { const [a, b] = [...PTR.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
function onDown(e) {
  if (CV.setPointerCapture) { try { CV.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
  PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  FLY = null; INERT.vx = INERT.vy = 0;
  if (PTR.size === 1) TAP = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  else { TAP = null; PINCH = pinchOf(); }
}
function onMove(e) {
  const p = PTR.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (PTR.size === 1) {
    if (TAP && !TAP.moved && Math.hypot(e.clientX - TAP.x, e.clientY - TAP.y) > 8) TAP.moved = true;
    if (!TAP || TAP.moved) {
      CAM.x -= dx / CAM.z; CAM.y -= dy / CAM.z; FOLLOW = false;
      const now = performance.now(), dtm = Math.max(8, now - LASTMV); LASTMV = now;
      INERT.vx = lerp(INERT.vx, -dx / CAM.z / dtm * 1000, 0.5); INERT.vy = lerp(INERT.vy, -dy / CAM.z / dtm * 1000, 0.5);
      clampCam();
    }
  } else if (PTR.size === 2 && PINCH) {
    const s = pinchOf();
    zoomAt(s.mx, s.my, CAM.z * s.d / PINCH.d);
    CAM.x -= (s.mx - PINCH.mx) / CAM.z; CAM.y -= (s.my - PINCH.my) / CAM.z;
    clampCam(); PINCH = s; FOLLOW = false;
  }
}
function onUp(e) {
  if (!PTR.has(e.pointerId)) return;
  PTR.delete(e.pointerId);
  if (PTR.size < 2) PINCH = null;
  if (PTR.size === 0) {
    if (TAP && !TAP.moved && performance.now() - TAP.t < 650) handleTap(e.clientX, e.clientY);
    if (performance.now() - LASTMV > 90) INERT.vx = INERT.vy = 0;
    TAP = null;
  }
}
function onWheel(e) { e.preventDefault(); FLY = null; zoomAt(e.clientX, e.clientY, CAM.z * Math.exp(-e.deltaY * 0.0016)); }
function onKey(e) {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key, step = 80 / CAM.z;
  if (k === 'Escape') closeSheet();
  else if (k === 'ArrowLeft') CAM.x -= step;
  else if (k === 'ArrowRight') CAM.x += step;
  else if (k === 'ArrowUp') CAM.y -= step;
  else if (k === 'ArrowDown') CAM.y += step;
  else if (k === '+' || k === '=') zoomAt(VW / 2, VH / 2, CAM.z * 1.25);
  else if (k === '-') zoomAt(VW / 2, VH / 2, CAM.z / 1.25);
  else return;
  clampCam();
}

/* picking */
function handleTap(sx, sy) {
  hideToast();
  const wx = CAM.x + (sx - VW / 2) / CAM.z, wy = CAM.y + (sy - VH / 2) / CAM.z, tol = 14 / CAM.z;
  for (const p of PLANES) {
    if (p.alpha < 0.3) continue;
    if (Math.hypot(ix(p.x, p.y) - wx, iy(p.x, p.y, p.z + 4) - wy) < Math.max(20, tol)) return pickObj({ t: 'plane', id: p.id });
  }
  let best = null, bd = Math.max(8, tol * 0.7);
  for (const c of CARS) {
    if (!c.on) continue;
    const d = Math.hypot(ix(c.x, c.y) - wx, iy(c.x, c.y, 3) - wy);
    if (d < bd) { bd = d; best = { t: 'car', id: c.id }; }
  }
  BOATS.forEach((b, i) => { const d = Math.hypot(ix(b.x, b.y) - wx, iy(b.x, b.y, 7) - wy); if (d < bd + 5) { bd = d; best = { t: 'boat', id: i }; } });
  if (best) return pickObj(best);
  for (let i = STATIC.length - 1; i >= 0; i--) {
    const s = STATIC[i];
    if (s.t !== 'b') continue;
    const bb = s.b.bb;
    if (wx < bb[0] || wx > bb[2] || wy < bb[1] || wy > bb[3]) continue;
    if (inPoly(s.b.hull, wx, wy)) { FOLLOW = false; openView({ k: 'b', id: s.b.id }, true); ensureVisible(s.b); return; }
  }
  const tx = Math.floor((wx / HW + wy / HH) / 2), ty = Math.floor((wy / HH - wx / HW) / 2);
  if (inMap(tx, ty) && tileInfo(tx, ty)) { FOLLOW = false; openView({ k: 'tile', x: tx, y: ty }, true); return; }
  closeSheet();
}
function pickObj(sel) { FOLLOW = true; openView({ k: sel.t, id: sel.id }, true); }

/* sheet */
function openView(v, fresh) {
  if (fresh) UI.stack = []; else if (UI.stack.length) UI.stack[UI.stack.length - 1].scroll = UI.body.scrollTop;
  UI.stack.push(v);
  renderView();
  if (!UI.open) { UI.open = true; UI.sheet.classList.add('open'); UI.sheet.setAttribute('aria-hidden', 'false'); document.body.classList.add('sheet-open'); }
}
function goBack() { UI.stack.pop(); if (!UI.stack.length) { closeSheet(); return; } renderView(); }
function closeSheet() {
  UI.open = false; UI.stack = [];
  UI.sheet.classList.remove('open'); UI.sheet.setAttribute('aria-hidden', 'true'); document.body.classList.remove('sheet-open');
  SEL = null; FOLLOW = false;
}
function renderView() {
  const v = UI.stack[UI.stack.length - 1];
  UI.back.hidden = UI.stack.length < 2;
  UI.body.innerHTML = (VIEWS[v.k] || (() => ''))(v);
  UI.body.scrollTop = v.scroll || 0;
  UI.body.querySelectorAll('canvas[data-portrait]').forEach(cv => drawPortrait(cv, BLD[+cv.dataset.portrait]));
  if (v.k === 'b') SEL = { t: 'b', id: v.id };
  else if (v.k === 'p') SEL = { t: 'b', id: PPL[v.id].home };
  else if (v.k === 'plane' || v.k === 'car' || v.k === 'boat') SEL = { t: v.k, id: v.id };
  else if (v.k === 'tile') SEL = { t: 'tile', x: v.x, y: v.y };
  else SEL = null;

function boardList(type) {
  const now = SIM.min, day = dayN(), out = [];
  for (let d = day - 1; d <= day + 1; d++) for (let i = 0; i < FL.length; i++) {
    const f = FL[i];
    if (f.type !== type) continue;
    const S = d * 1440 + f.t, dl = delayOf(i, d), T = S + dl;
    if (T < now - 50) continue;
    out.push({ i, f, S, T, dl });

  return out.sort((a, b) => a.S - b.S);
}
function statusOf(r, type) {
  const now = SIM.min, T = r.T;
  if (type === 'd') {
    if (now >= T) return ['Вылетел', 'done'];
    if (now >= T - 15) return ['Посадка окончена', 'closed'];
    if (now >= T - 40) return ['Идёт посадка', 'go'];
    if (now >= T - 130) return ['Регистрация', 'reg'];
    return r.dl ? ['Задержан до ' + hm(T), 'bad'] : ['По расписанию', 'ok'];
  }
  if (now >= T) return ['Прибыл', 'done'];
  if (now >= T - 25) return ['Заходит на посадку', 'go'];
  return r.dl ? ['Задержан до ' + hm(T), 'bad'] : ['Ожидается', 'ok'];

  if (t === TT.FIELD) return { icon: '⚽', tint: '#4f9a45', title: 'Школьное поле', kind: 'Футбольное поле', desc: 'После уроков здесь играют в футбол, а по выходным тренируется детская команда «Волны».' };
  if (t === TT.SOLAR) return { icon: '☀', tint: '#f2b705', title: 'Солнечное поле', kind: 'Энергоцентр Virtual City', facts: [['Панелей', '1 920'], ['Выработка сейчас', live('solar')]] };
  if (t === TT.RUNWAY) return { icon: '🛫', tint: '#14a3b8', title: 'Взлётная полоса', kind: 'Аэропорт Virtual City', facts: [['Длина', '2 800 м'], ['Сейчас', live('rwy')]] };
  if (t === TT.APRON) return { icon: '✈', tint: '#14a3b8', title: 'Перрон', kind: 'Аэропорт Virtual City', facts: [['Выходов', '3'], ['Самолётов у выходов', live('gates')]] };
  return null;
}
VIEWS.tile = v => {
  const T = tileInfo(v.x, v.y);
  if (!T) return '';
  return `<div class="hero"><div class="badge" style="--tint:${T.tint}" aria-hidden="true">${T.icon}</div><div class="hero-t"><p class="kind">${esc(T.kind)}</p><h2 class="title">${esc(T.title)}</h2></div></div>`
    + (T.desc ? `<p class="desc">${esc(T.desc)}</p>` : '') + (T.facts ? facts(T.facts) : '');
};

/* main loop and boot */
const PERF = { ema: 16, t: 0 };
function loop(now) {
  const raw = now - LAST, dt = Math.min(0.05, Math.max(0, raw / 1000));
  LAST = now;
  if (raw > 0 && raw < 250) {
    // if frames are slow, render at a lower pixel density
    PERF.ema = lerp(PERF.ema, raw, 0.04); PERF.t += raw;
    if (PERF.t > 3000) { PERF.t = 0; if (PERF.ema > 30 && DPR > 1.25) { QDPR = Math.max(1.25, DPR - 0.25); resize(); } }
  }
  stepCamera(dt);
  update(dt);
  render();
  updateHUD();
  requestAnimationFrame(loop);
}
function start(saved) {
  saved = saved || {};
  const now = new Date();
  SIM.wd0 = now.getDay();
  SIM.min = now.getHours() * 60 + now.getMinutes();
  genWorld();
  OPEN = new Uint8Array(BLD.length);
  for (const b of BLD) if (b.comp) for (const c of b.comp) for (const j of c.jobs) if (j.p != null) PPL[j.p].co = c.name;
  buildGround();
  initAgents();
  initCanvas();
  initUI();
  CAM.z = VW < 700 ? 0.62 : clamp(Math.min(VW / 1500, VH / 820), 0.5, 1.1);
  CAM.x = ix(14.5, 11); CAM.y = iy(14.5, 11, 20);
  if (typeof saved.min === 'number') {
    SIM.min = saved.min; SIM.wd0 = saved.wd0 ?? SIM.wd0;
    CAM.x = saved.x ?? CAM.x; CAM.y = saved.y ?? CAM.y; CAM.z = saved.z ?? CAM.z;
    SHOW_LABELS = saved.labels ?? true; $('#btnLabels').setAttribute('aria-pressed', String(SHOW_LABELS));
    setSpeed(saved.sp ?? 1);
  }
  clampCam();
  computeLight(); updateHourly();
  if (LIGHT.sa > 0) buildShadows(LIGHT.sdx, LIGHT.sdy);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const L of LABELS) L.w = 0; for (const b of BLD) { if (b.sgn) b.sgn.fs = 0; if (b.lab) b.lab.w = 0; } });
  window.__city = {
    setTime: m => { SIM.min = Math.floor(SIM.min / 1440) * 1440 + m; HUD_MIN = -1; },
    open: (k, id) => openView(k === 'b' ? { k, id } : { k, id, q: '', cat: '' }, true),
    find: s => BLD.filter(b => b.name.includes(s) || b.kind === s).map(b => b.id),
    cam: CAM, sim: SIM, stats: STATS, planes: PLANES,
  };
  requestAnimationFrame(t => { LAST = t; loop(t); });
}
(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ min: SIM.min, wd0: SIM.wd0, sp: SIM.sp, x: CAM.x, y: CAM.y, z: CAM.z, labels: SHOW_LABELS }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
