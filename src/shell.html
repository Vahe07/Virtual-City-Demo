<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<canvas id="city" aria-label="Карта Virtual City. Нажмите на здание, чтобы увидеть цену, доход и владельцев."></canvas>
<header class="hud-top">
  <div class="hud-l">
    <button class="citysign" id="citySign" type="button" aria-label="Обзор Virtual City"><span class="cs-name">VIRTUAL CITY</span><span class="cs-sub" id="citySub"></span></button>
    <button class="wallet glass" id="wallet" type="button" aria-label="Мой кабинет: баланс купонов"><i class="cn" aria-hidden="true"></i><b id="walBal">0</b><span class="wl">тест</span></button>
  </div>
  <div class="clockbox">
    <div class="clock glass"><span class="ck-ico sun" id="ckIco" aria-hidden="true"></span><span class="ck-time" id="ckTime">12:00</span><span class="ck-day" id="ckDay"></span><span class="ck-temp" id="ckTemp"></span></div>
    <div class="speed glass" role="group" aria-label="Скорость времени">
      <button type="button" data-speed="0" aria-label="Пауза" aria-pressed="false">❚❚</button>
      <button type="button" data-speed="1" aria-label="Минута за секунду" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-label="Десять минут за секунду" aria-pressed="false">10×</button>
      <button type="button" data-speed="3" aria-label="Час за секунду" aria-pressed="false">60×</button>
    </div>
    <button class="ownbtn glass" id="btnOwn" type="button" aria-pressed="false"><i class="ob" aria-hidden="true"></i>Владение</button>
    <div class="ownlg glass" aria-hidden="true"><span><i style="background:#f2b705"></i>ваше</span><span><i style="background:#1fae6a"></i>продаёт платформа</span><span><i style="background:#ff6b4a"></i>продают игроки</span><span><i style="background:#6c63ff"></i>у игроков</span><span><i style="background:#8a939c"></i>город</span></div>
  </div>
</header>
<div class="toast" id="toast" role="status">Нажмите на дом или кафе: цена, доход, покупка</div>
<div class="notes" id="notes" aria-live="polite"></div>
<nav class="dock glass" aria-label="Разделы">
  <button type="button" data-open="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5v10A2.5 2.5 0 0 0 6.5 20H20V8H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="16" cy="14" r="1.3"/></svg><span>Кабинет</span></button>
  <button type="button" data-open="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.4"/></svg><span>Рынок</span></button>
  <button type="button" data-open="rich"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.6 3.2M17 6h2.5a2.5 2.5 0 0 1-2.6 3.2"/></svg><span>Рейтинг</span></button>
  <button type="button" data-open="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M12 9v11.5M3.5 13h17M12 9c-1.5-3.5-6-4.5-6-1.8C6 9 12 9 12 9zM12 9c1.5-3.5 6-4.5 6-1.8C18 9 12 9 12 9z"/></svg><span>Лента</span></button>
  <button type="button" data-open="dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg><span>Справочник</span></button>
</nav>
<section class="sheet" id="sheet" aria-hidden="true" aria-label="Карточка места">
  <div class="sheet-head" id="sheetHead"><button type="button" class="sh-btn" id="shBack" aria-label="Назад" hidden>‹</button><span class="sh-grip" aria-hidden="true"></span><button type="button" class="sh-btn" id="shClose" aria-label="Закрыть">✕</button></div>
  <div class="sheet-body" id="shBody"></div>
</section>
<script>
/*JS*/
</script>
</body>
</html>
